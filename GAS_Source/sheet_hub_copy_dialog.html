<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 16px;
      }
      h3 {
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 10px;
        line-height: 1.5;
        color: #444;
        font-size: 13px;
      }
      textarea {
        width: 100%;
        height: 300px;
        box-sizing: border-box;
        font-family: Consolas, monospace;
        font-size: 11px;
        resize: vertical;
      }
      .actions {
        margin-top: 10px;
      }
      button {
        padding: 8px 14px;
        cursor: pointer;
        margin-right: 8px;
        font-size: 13px;
      }
      #status {
        margin-top: 10px;
        font-weight: bold;
        font-size: 13px;
      }
      .ok  { color: #0b6b2a; }
      .err { color: #b00020; }
    </style>
  </head>
  <body>
    <h3 id="title"></h3>
    <p>자동 복사 시도 중입니다. 실패 시 textarea를 클릭 후 <b>Ctrl+A → Ctrl+C</b> 하세요.</p>
    <textarea id="ta" readonly></textarea>
    <div class="actions">
      <button onclick="copyNow()">복사</button>
      <button onclick="selectAll()">전체선택</button>
      <button onclick="google.script.host.close()">닫기</button>
    </div>
    <div id="status"></div>
    <script>
      // JSON.stringify가 \r\n을 \r\n 이스케이프 시퀀스로 보존 → JS 파싱 후 실제 CR+LF 문자로 복원
      // textarea.value는 브라우저가 \n으로 정규화하므로 JS 변수를 직접 사용
      var CLIPBOARD_TEXT = <?!= JSON.stringify(clipboardText) ?>;
      var DIALOG_TITLE   = <?!= JSON.stringify(dialogTitle) ?>;

      document.getElementById('title').textContent = DIALOG_TITLE;
      document.getElementById('ta').value = CLIPBOARD_TEXT;

      function selectAll() {
        var ta = document.getElementById('ta');
        ta.focus();
        ta.select();
      }

      async function copyNow() {
        var statusEl = document.getElementById('status');
        try {
          if (navigator.clipboard && window.isSecureContext) {
            // CLIPBOARD_TEXT(JS 변수) 직접 사용: \r\n 보존됨
            await navigator.clipboard.writeText(CLIPBOARD_TEXT);
          } else {
            // 구형 브라우저 fallback
            selectAll();
            document.execCommand('copy');
          }
          statusEl.textContent = '✅ 복사 완료. 이카운트 자료올리기에 붙여넣기 하세요.';
          statusEl.className = 'ok';
        } catch (err) {
          selectAll();
          statusEl.textContent = '⚠ 자동 복사 실패 — textarea 클릭 후 Ctrl+A → Ctrl+C 하세요.';
          statusEl.className = 'err';
        }
      }

      window.addEventListener('load', function() {
        copyNow();
      });
    </script>
  </body>
</html>
